name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, build, test and confidentiality check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node, gitleaks, actionlint, zizmor and shellcheck come from mise.toml, the same
      # declaration used locally. No cache: tag builds must not restore state written by PRs.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.2.16
          install: true
          cache: false

      # Playwright's Chromium headless shell, pinned by the exact @playwright/test version in
      # package-lock.json, plus its OS libraries; the same build renders the baselines locally.
      # No cache, for the same reason as above.
      - name: Install the pinned Playwright browser
        run: make browsers PLAYWRIGHT_INSTALL_FLAGS=--with-deps

      # The deny-list lives in a private repo; the read-only token never reaches the log and
      # the file stays outside the workspace. A missing secret makes the scan fail closed.
      - name: Fetch deny-list
        env:
          GH_TOKEN: ${{ secrets.MQ_DENYLIST_TOKEN }}
          DENYLIST_REPO: ${{ vars.MQ_DENYLIST_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$DENYLIST_REPO" ]; then
            echo "::error::MQ_DENYLIST_TOKEN secret or MQ_DENYLIST_REPO variable is not set"
            exit 1
          fi
          gh api "repos/${DENYLIST_REPO}/contents/denylist.txt" \
            -H "Accept: application/vnd.github.raw" > "${RUNNER_TEMP}/denylist.txt"
          echo "MQ_DENYLIST=${RUNNER_TEMP}/denylist.txt" >> "$GITHUB_ENV"

      - run: make check

      # On failure only: Playwright's actual, expected and diff images, so baselines can be
      # checked (or regenerated once, plan increment 11) from the runner's own rendering.
      # The artifact token is the runner's own; no permission is added.
      - name: Upload Playwright test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
