name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, build, test and confidentiality check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node, gitleaks, actionlint, zizmor and shellcheck come from mise.toml, the same
      # declaration used locally. No cache: tag builds must not restore state written by PRs.
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.2.16
          install: true
          cache: false

      # Playwright's Chromium headless shell, pinned by the exact @playwright/test version in
      # package-lock.json, plus its OS libraries; the same build renders the baselines locally.
      # No cache, for the same reason as above.
      - name: Install the pinned Playwright browser
        run: make browsers PLAYWRIGHT_INSTALL_FLAGS=--with-deps

      # The deny-list lives in a private repo; the read-only token never reaches the log and
      # the file stays outside the workspace. A missing secret makes the scan fail closed.
      - name: Fetch deny-list
        env:
          GH_TOKEN: ${{ secrets.MQ_DENYLIST_TOKEN }}
          DENYLIST_REPO: ${{ vars.MQ_DENYLIST_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$DENYLIST_REPO" ]; then
            echo "::error::MQ_DENYLIST_TOKEN secret or MQ_DENYLIST_REPO variable is not set"
            exit 1
          fi
          gh api "repos/${DENYLIST_REPO}/contents/denylist.txt" \
            -H "Accept: application/vnd.github.raw" > "${RUNNER_TEMP}/denylist.txt"
          echo "MQ_DENYLIST=${RUNNER_TEMP}/denylist.txt" >> "$GITHUB_ENV"

      - run: make check

      # On failure only: Playwright's actual, expected and diff images, so baselines can be
      # checked (or regenerated once, plan increment 11) from the runner's own rendering.
      # The artifact token is the runner's own; no permission is added.
      - name: Upload Playwright test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # @medquantis/ui (packages/ui): make ui-check, only when the change touches the package or the
  # workspace's install. A step decides, not a workflow paths: filter, so the workflow and this job
  # always run and report; without such a change the job passes with its steps skipped. Not a
  # required check. The confidentiality scan of packages/ui/ stays in make check above.
  ui:
    name: Lint, type-check, test and build @medquantis/ui
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The base is the pull request's base commit, or the commit before the push; a new branch or
      # a tag has none, so the check runs. Event values reach the script through env only.
      - name: Find whether @medquantis/ui changed
        id: changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}"; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD -- packages/ui/ package.json package-lock.json | grep -q .; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.changes.outputs.ui == 'true' }}
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.2.16
          install: true
          cache: false

      - if: ${{ steps.changes.outputs.ui == 'true' }}
        run: make ui-check
