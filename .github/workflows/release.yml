name: Release

# release-please keeps a release PR open on main; merging it tags vX.Y.Z and creates the GitHub
# release. Only then does the check job run the full gate with the real deny-list and pack the
# tarball, and the publish job sends that exact tarball to npm through trusted publishing.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # release commit, tag and GitHub release
      issues: write # release-please labels on the release PR
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag pushed with the workflow token starts no other workflow, so ci.yml never runs on a
  # release tag: this job repeats its gate on the tagged commit before anything is published.
  check:
    name: Check the tagged release
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.2.16
          install: true
          cache: false

      - name: Install the pinned Playwright browser
        run: make browsers PLAYWRIGHT_INSTALL_FLAGS=--with-deps

      # Same fetch as ci.yml: the deny-list stays outside the workspace and a missing secret
      # fails closed, so nothing is published without the real confidentiality scan.
      - name: Fetch deny-list
        env:
          GH_TOKEN: ${{ secrets.MQ_DENYLIST_TOKEN }}
          DENYLIST_REPO: ${{ vars.MQ_DENYLIST_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$DENYLIST_REPO" ]; then
            echo "::error::MQ_DENYLIST_TOKEN secret or MQ_DENYLIST_REPO variable is not set"
            exit 1
          fi
          gh api "repos/${DENYLIST_REPO}/contents/denylist.txt" \
            -H "Accept: application/vnd.github.raw" > "${RUNNER_TEMP}/denylist.txt"
          echo "MQ_DENYLIST=${RUNNER_TEMP}/denylist.txt" >> "$GITHUB_ENV"

      - run: make check

      # make check ends on a fresh build; the files allow-list in package.json keeps the
      # specimen and every other local output out of the tarball.
      - name: Pack the release tarball
        run: |
          mkdir -p "${RUNNER_TEMP}/package"
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}/package"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 7

  # Trusted publishing: npm exchanges this job's OIDC token for a short-lived publish token and
  # attaches provenance. No npm token exists in the repository. The job installs and builds
  # nothing, so no dependency code runs while the OIDC token can be requested.
  publish:
    name: Publish to npm
    needs: [release-please, check]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      # Only for mise.toml, so npm comes from the same pinned Node as every other job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.2.16
          install: true
          install_args: node
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package

      - name: Require npm 11.5.1 or later for trusted publishing
        run: |
          version="$(npm --version)"
          lowest="$(printf '%s\n%s\n' "11.5.1" "$version" | sort -V | head -n 1)"
          if [ "$lowest" != "11.5.1" ]; then
            echo "::error::npm ${version} is older than 11.5.1 and cannot use trusted publishing"
            exit 1
          fi

      - name: Publish with provenance
        run: npm publish "${RUNNER_TEMP}"/package/*.tgz --provenance --access public --ignore-scripts
